# Runs ci.sh, which already knows how to build every example, smoke-launch the
# non-driver ones, and drive the calculator and testable examples over
# AetherUIDriver. Until now nothing invoked it automatically, so the GTK4
# backend in particular was only ever compiled by whoever happened to be on
# Linux that week.
#
# Linux and macOS are real gates. Windows is deliberately absent rather than
# present-and-soft-failing: ci.sh's Windows path needs the aether repo's
# `make contrib-aether-ui-check`, which is a cross-repo dependency this
# workflow does not set up. A job that always passed would read as coverage
# the project does not have.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung step otherwise runs until the 6 hour default. The full pipeline is
    # roughly 20 minutes; 45 leaves room without letting a hang sit there.
    timeout-minutes: 45
    strategy:
      fail-fast: false   # a GTK4 failure should not hide an AppKit one
      matrix:
        include:
          - name: linux-gtk4
            os: ubuntu-latest
          - name: macos-appkit
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and a framebuffer
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # Do NOT add packages to this line casually. Adding gdb hung this
          # step for 45 minutes, twice, including with DEBIAN_FRONTEND set,
          # and cost the whole Linux leg both times. These two install in
          # about two minutes and are what the pipeline actually needs.
          sudo -E apt-get install -y --no-install-recommends libgtk-4-dev xvfb
          # A driver spec that dies takes its diagnosis with it: the spec only
          # sees POSTs that stopped being answered. Cores go somewhere ci.sh
          # can find, and it prints a backtrace when a debugger is present.
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p

      # macOS keeps Homebrew out of clang's default library search path
      # (/usr/lib is searched; /opt/homebrew/lib is not, and openssl@3 is
      # keg-only on top of that). Linux finds these in system paths, which is
      # why only this leg needs the step.
      #
      # It became load-bearing with the Shape A conversion: `ae cflags --libs`
      # emits -lssl -lcrypto -lz -lnghttp2 -lpcre2-8 for libaether.a's
      # transitive deps, and the aeb `bldr` module links the runtime into the
      # fan-out ORCHESTRATOR, where the old `build` module did not. So the
      # orchestrator now needs these at link time and the build stops with
      # `ld: library 'ssl' not found` before a single node runs.
      - name: Make Homebrew's libraries linkable
        if: runner.os == 'macOS'
        run: |
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix)/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"

      # Both toolchains, matching bootstrap.sh: ci.sh drives the per-target
      # .build.ae files through aeb, so ae alone is not enough. Installed
      # directly rather than via bootstrap.sh, which would also run a build.
      - name: Install the Aether toolchain
        env:
          # Pin to keep a green run reproducible; bump deliberately.
          #
          # These were empty, so get.sh resolved "the latest vX.Y.Z tag" on
          # every run. That makes this pipeline's colour depend on whatever
          # upstream published most recently: v0.552.0 shipped the codegen bug
          # in aether#1657, which crashed apps/rubiks_cube here with no change
          # in this repo. A default pin means upstream lands in this pipeline
          # when someone bumps this line, not whenever a release is cut.
          #
          # v0.553.0 was the first release carrying the aether#1658 fix, so the
          # pin became a tag again rather than the commit it was pinned to
          # while that release was still being cut. A repository variable
          # still overrides, for testing a candidate without a commit.
          #
          # v0.613.0 (2026-08-31): std.spec's run_summary RETURNS its verdict
          # (0 green / 1 failed) instead of exit(1)-ing, so cleanup after the
          # run — arena.destroy, server_stop, sqlite.close — stops being
          # skipped on exactly the failing runs where a leaked arena or an
          # orphaned listener does the most damage.
          #
          # THE FOOTGUN THIS BUMP CARRIES, and why every spec here changed
          # with it: a BARE `spec.run_summary(fw)` as the last statement now
          # silently turns a failing suite GREEN. main() has no return
          # annotation and its return value is the process exit status, so
          # dropping the verdict exits 0 regardless of results. All 81 call
          # sites under tests/ and vg/test/ are `return spec.run_summary(fw)`
          # as of this commit; a new spec MUST return it too.
          AETHER_REF: ${{ vars.AETHER_REF || 'v0.613.0' }}
          # v0.283 is the first release carrying aeb's `bldr` module.
          # 9c84d786 converted all 109 build nodes to aeb Shape A
          # (`bldr.build() {}`, b-free); v0.282 has no `bldr` at all, so every
          # node failed type-checking with `Undefined function 'bldr.build'`
          # and the fan-out scheduled nothing. That took main red for four
          # consecutive commits.
          #
          # v0.282 was itself pinned for b1bfa5e (encode_name ae-escapes a
          # dot-prefixed fan-out root, so `.all.ae` links — v0.281 predated it
          # and failed on the root's entry symbol). v0.283 carries that too,
          # so this is a strict move forward.
          #
          # Verified against current main before bumping: with this repo's
          # existing AETHER_REF (v0.553.0, unchanged) and aeb v0.283, the whole
          # fan-out builds — exit 0, 0 failed nodes. aeb v0.282 with the same
          # ae fails every node. The ae pin needs no change; `bldr` is aeb's.
          AEB_REF: ${{ vars.AEB_REF || 'v0.283' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | PREFIX="$HOME/.local" sh
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeb/main/install.sh \
            | PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Version check
        run: |
          ae --version
          aeb --version

      - name: Run the UI test pipeline
        run: ./ci.sh

  # The Win32 backend is the one nobody can run here. There is no Windows leg
  # (ci.sh's Windows path needs the aether repo's `make
  # contrib-aether-ui-check`, a cross-repo dependency this workflow does not
  # set up), so its sources have been edited and shipped without ever being
  # COMPILED: eight commits touched aether_ui_win32.c in two days that way.
  #
  # This does not run anything, and does not pretend to. It cross-compiles,
  # which is the difference between "mirrors the other backends" and "is known
  # to build", for an apt package and about a second.
  #
  # Its own job on purpose. The GTK4 leg's install line carries a warning
  # about being extended casually (adding gdb hung it for 45 minutes, twice),
  # and an isolated job cannot take the real gates down with it. It needs no
  # aether toolchain either: the backend sources compile against backend/ and
  # the Windows SDK headers alone.
  win32-crosscheck:
    name: win32-crosscheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the mingw-w64 cross-compiler
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      # -Wall -Werror: this is the one backend nobody on the team can run, so
      # the compiler is the only reader it gets. The gate ran at the default
      # level while a backlog of pre-existing warnings made that unfair to
      # whoever's change tripped it; the backlog is zero, so it closes here.
      - name: Cross-compile the Win32 backend
        run: |
          for src in backend/aether_ui_win32.c \
                     backend/aether_ui_test_server.c \
                     backend/aether_ui_system_extras.c; do
            echo "--- $src"
            x86_64-w64-mingw32-gcc -fsyntax-only -Wall -Werror -Ibackend "$src"
          done

      # Syntax is not the whole story: a Windows API declared in a header
      # whose import library is missing compiles perfectly and fails at link.
      # Dropping -lole32 leaves the step above at 0 errors while this one
      # reports __imp_CoCreateInstance.
      - name: Build the Win32 runtime test
        run: |
          x86_64-w64-mingw32-gcc -o /tmp/aether_ui_win32_test.exe \
            tests/win32/win32_runtime_test.c \
            backend/aether_ui_win32.c \
            backend/aether_ui_test_server.c \
            backend/aether_ui_system_extras.c \
            -Ibackend \
            -luser32 -lgdi32 -lgdiplus -lmsimg32 -lcomctl32 -lcomdlg32 \
            -lshell32 -lole32 -loleaut32 -luuid -loleacc -ldwmapi \
            -luxtheme -lws2_32 -lbcrypt
          echo "linked: $(ls -l /tmp/aether_ui_win32_test.exe | awk '{print $5}') bytes"

      - name: Install Wine
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends wine xvfb x11-utils

      # A primitive that compiles, links, and paints nothing looks exactly
      # like one that works, which is how canvas_clip_rect stayed a silent
      # no-op here for the life of the backend. This RUNS the thing and
      # asserts on rendered pixels, once per renderer: canvas_replay_to_dc
      # dispatches to a GDI+ path and a legacy GDI path that implement
      # clipping with entirely different calls, so one passing says nothing
      # about the other.
      - name: Run the Win32 backend under Wine
        env:
          WINEDEBUG: -all
          # Skip the Mono/Gecko installer prompts: nothing here is managed code.
          WINEDLLOVERRIDES: mscoree=d;mshtml=d
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          for i in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          wineboot --init 2>/dev/null || true
          wine /tmp/aether_ui_win32_test.exe
          AETHER_UI_WIN32_RENDERER=legacy wine /tmp/aether_ui_win32_test.exe
